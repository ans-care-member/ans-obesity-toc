<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>肥満症のご案内</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }
/* Layout: one narrow column, a title, then one large button per destination. */
:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --fg: #212121;
  --fg-sub: #616161;
  --border: #E0E0E0;
  --primary: #D93700;
  --primary-hover: #C12700;
  --primary-text: #E63F00;
  --primary-soft: #FCE8E5;
  --focus: #2196F3;
  --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1A1A; --surface: #242424; --fg: #FAFAFA; --fg-sub: #BDBDBD; --border: #424242;
    --primary: #FF6832; --primary-hover: #FF8250; --primary-text: #FF8250; --primary-soft: #3A2218;
    --focus: #64B5F6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1A1A; --surface: #242424; --fg: #FAFAFA; --fg-sub: #BDBDBD; --border: #424242;
  --primary: #FF6832; --primary-hover: #FF8250; --primary-text: #FF8250; --primary-soft: #3A2218;
  --focus: #64B5F6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 500; font-size: 16px; line-height: 1.7; padding-inline: 16px; padding-block: 24px 32px; }
.app { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 24px; line-height: 1.2; font-weight: 700; margin: 0; text-wrap: balance; }
.lead { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: var(--fg-sub); }
.menu { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.item { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 16px; border: 2px solid var(--primary); border-radius: 8px; background: var(--surface); color: var(--primary-text); text-decoration: none; min-width: 0; }
.item:hover { border-color: var(--primary-hover); background: var(--primary-soft); }
.item:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.item .ico { flex: none; }
.item .txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.item .ttl { font-size: 16px; line-height: 1.4; font-weight: 700; }
.item .sub { font-size: 12px; line-height: 1.5; font-weight: 500; color: var(--fg-sub); }
.item .go { flex: none; }
@media (prefers-reduced-motion: no-preference) { .item { transition: background-color .15s, border-color .15s; } }
@media (max-width: 380px) { body { padding-inline: 8px; } h1 { font-size: 22px; } .item { padding: 12px; } }
</style>
</head>
<body>

      </a>
    </li>

    <li>

        <span class="txt"><span class="ttl">コラム</span><span class="sub">肥満症について、くわしく読む</span></span>
        <svg class="go" width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m96 48 80 80-80 80"/></svg>

  </ul>
</main>
</body>
</html>
